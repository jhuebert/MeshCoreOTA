<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- MeshCoreOTA app icon: a connected mesh delivering a firmware update to its centre node. -->
  <rect width="1024" height="1024" rx="224" fill="#0B1220"/>
  <circle cx="512" cy="512" r="348" fill="#152238"/>

  <!-- mesh links -->
  <g fill="none" stroke="#38BDF8" stroke-width="14" stroke-linecap="round" opacity="0.5">
    <path d="M 762 512 L 637 728 L 387 728 L 262 512 L 387 296 L 637 296 Z"/>
    <path d="M 762 512 L 262 512"/>
    <path d="M 637 728 L 387 296"/>
    <path d="M 387 728 L 637 296"/>
  </g>

  <!-- outer nodes -->
  <g fill="#FBBF24">
    <circle cx="762" cy="512" r="30"/>
    <circle cx="637" cy="728" r="30"/>
    <circle cx="387" cy="728" r="30"/>
    <circle cx="262" cy="512" r="30"/>
    <circle cx="387" cy="296" r="30"/>
    <circle cx="637" cy="296" r="30"/>
  </g>

  <!-- centre node + update arrow -->
  <circle cx="512" cy="512" r="98" fill="#1E3A5F" stroke="#38BDF8" stroke-width="14"/>
  <rect x="494" y="468" width="36" height="72" rx="8" fill="#38BDF8"/>
  <path d="M 466 524 L 558 524 L 512 574 Z" fill="#38BDF8"/>
</svg>
